name: optional-ml-smoke

on:
  workflow_dispatch:

jobs:
  pytorch-onnx-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install numpy Pillow torch onnx onnxruntime
      - run: python scripts/create_ml_smoke_fixture.py --output runs/smoke_mvtec --size 64
      - run: >-
          python -m surface_perception.cli build-manifest
          --mvtec-root runs/smoke_mvtec --categories metal_panel
          --output runs/real_smoke/manifest.json
      - run: >-
          python -m surface_perception.train_real
          --manifest runs/real_smoke/manifest.json --output runs/real_smoke/model
          --image-size 64 --base-channels 4 --epochs 2 --batch-size 4
      - run: >-
          python -m surface_perception.evaluate_real
          --manifest runs/real_smoke/manifest.json
          --checkpoint runs/real_smoke/model/best.pt --output runs/real_smoke/evaluation
      - run: >-
          python -m surface_perception.export_onnx
          --checkpoint runs/real_smoke/model/best.pt
          --output runs/real_smoke/model/model.onnx --image-size 64
      - run: >-
          python -m surface_perception.onnx_parity
          --checkpoint runs/real_smoke/model/best.pt
          --onnx runs/real_smoke/model/model.onnx
          --manifest runs/real_smoke/manifest.json --samples 5 --image-size 64
      - run: >-
          python -m surface_perception.model_compression
          --config configs/model_compression_v10.json
          --manifest runs/real_smoke/manifest.json
          --teacher-checkpoint runs/real_smoke/model/best.pt
          --output runs/compression_smoke
          --image-size 64 --student-base-channels 2 --student-epochs 1
          --batch-size 4 --onnx-iterations 3 --onnx-trials 1 --parity-samples 3
      - run: >-
          python -m surface_perception.active_learning
          --config configs/active_learning_v11.json
          --manifest runs/real_smoke/manifest.json
          --checkpoint runs/compression_smoke/student_distilled/best.pt
          --output runs/active_learning_smoke
          --portable-evidence runs/active_learning_smoke/portable_evidence.json
          --image-size 64 --batch-size 4 --queue-budget 4 --calibration-pixels 10000
      - uses: actions/upload-artifact@v4
        with:
          name: model-compression-and-review-smoke-evidence
          path: |
            runs/compression_smoke/compression_study.json
            runs/active_learning_smoke/active_learning_study.json
            runs/active_learning_smoke/review_queue.json
