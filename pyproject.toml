[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "industrial-surface-perception"
version = "0.4.0"
description = "Real-data surface segmentation, ONNX deployment, and safe robotic coverage planning."
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26,<3",
  "Pillow>=10,<12",
]

[project.optional-dependencies]
ml = [
  "torch>=2.4",
  "torchvision>=0.19",
  "onnx>=1.16",
  "onnxruntime>=1.19",
  "opencv-python-headless>=4.10",
]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
surface-perception = "surface_perception.cli:main"

[tool.setuptools.packages.find]
include = ["surface_perception*"]

[tool.ruff]
line-length = 100
target-version = "py310"
